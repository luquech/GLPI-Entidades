<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Matriz Curricular Compacta | Fluxo por Colunas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
      background: #eef2f5;
      margin: 0;
      padding: 16px;
      color: #1e2a3e;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* cabeçalho reduzido */
    .header {
      background: white;
      border-radius: 24px;
      padding: 0.8rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      border: 1px solid #e2e8f0;
    }

    .title h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e4a6e, #0f2b3d);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .title p {
      margin: 0;
      font-size: 0.7rem;
      color: #4b6f8c;
    }

    .progress-panel {
      background: #f8fafc;
      border-radius: 2rem;
      padding: 0.4rem 1.2rem;
      min-width: 180px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .progress-label {
      font-weight: 600;
      font-size: 0.7rem;
      color: #2c5a74;
    }

    .progress-value {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1;
      color: #1e5a7a;
    }

    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 40px;
      height: 6px;
      width: 100%;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-fill {
      background: #2c7da0;
      width: 0%;
      height: 100%;
      border-radius: 40px;
      transition: width 0.2s;
    }

    button.reset-btn {
      background: none;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 6px;
    }

    /* colunas */
    .columns-wrapper {
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .matrix-columns {
      display: flex;
      gap: 16px;
      min-width: min-content;
      align-items: flex-start;
    }

    .level-column {
      background: white;
      border-radius: 20px;
      width: 270px;
      min-width: 270px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2edf2;
    }

    .column-header {
      background: #f9fbfd;
      padding: 0.6rem;
      border-bottom: 1px solid #e0ecf3;
      border-radius: 20px 20px 0 0;
      text-align: center;
    }

    .column-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: #155e75;
    }

    .column-header span {
      font-size: 0.6rem;
      background: #e6f0f5;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
    }

    .subjects-list {
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    /* cards menores */
    .subject-card {
      border-radius: 16px;
      padding: 0.6rem;
      transition: all 0.15s;
      cursor: pointer;
      border: 1px solid transparent;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    /* cores mais vivas */
    .subject-completed {
      background: #81c784;  /* verde vivo */
      border-color: #4caf50;
      color: #1b3b1a;
    }
    .subject-completed:hover {
      background: #66bb6a;
      transform: translateY(-1px);
    }

    .subject-available {
      background: #64b5f6;  /* azul vivo */
      border-color: #42a5f5;
      color: #0d2e4a;
    }
    .subject-available:hover {
      background: #42a5f5;
      transform: translateY(-1px);
    }

    .subject-blocked {
      background: #e0e0e0;
      border-color: #bdbdbd;
      color: #616161;
      cursor: not-allowed;
      opacity: 0.8;
    }
    .subject-blocked:hover {
      transform: none;
      background: #e0e0e0;
    }

    .subject-code {
      font-family: monospace;
      font-size: 0.6rem;
      font-weight: 700;
      background: rgba(255,255,240,0.8);
      display: inline-block;
      padding: 1px 6px;
      border-radius: 20px;
    }

    .subject-name {
      font-weight: 700;
      font-size: 0.75rem;
      margin: 5px 0 2px;
      line-height: 1.2;
    }

    .subject-ch {
      font-size: 0.6rem;
      background: rgba(0,0,0,0.08);
      padding: 1px 6px;
      border-radius: 20px;
      display: inline-block;
    }

    .pre-req-hint {
      font-size: 0.6rem;
      color: rgba(0,0,0,0.6);
      margin-top: 5px;
      border-top: 1px dashed rgba(0,0,0,0.15);
      padding-top: 4px;
    }

    .status-badge {
      font-size: 0.55rem;
      font-weight: 600;
      background: rgba(255,255,240,0.8);
      padding: 1px 5px;
      border-radius: 20px;
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.65rem;
      color: #5b6e8c;
      background: white;
      padding: 8px;
      border-radius: 24px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">
      <h1>📚 Matriz Curricular · Fluxo por Nível</h1>
      <p>Clique nas disciplinas disponíveis (azul) para avançar | Pré-requisitos em cascata</p>
    </div>
    <div class="progress-panel">
      <div class="progress-label">✅ PROGRESSO OBRIGATÓRIAS</div>
      <div class="progress-value" id="percentDisplay">0%</div>
      <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
      <button class="reset-btn" id="resetBtn">🔄 Redefinir tudo</button>
    </div>
  </div>

  <div class="columns-wrapper">
    <div class="matrix-columns" id="matrixColumns"></div>
  </div>
  <footer>
    🎓 <strong>Cores</strong>: 
    <span style="background:#81c784; padding:2px 8px; border-radius:16px;">✅ Cursada</span> 
    <span style="background:#64b5f6; padding:2px 8px; border-radius:16px;">🔓 Disponível</span> 
    <span style="background:#e0e0e0; padding:2px 8px; border-radius:16px;">🔒 Bloqueada</span>
    <br>✔️ Se você desmarcar uma disciplina, todas que dependem dela serão automaticamente desmarcadas.
  </footer>
</div>

<script>
  // --------------------------------------------------------------
  // Matriz obrigatória (dados completos)
  // --------------------------------------------------------------
  const mandatorySubjects = [
    { nivel: "1° Nível", codigo: "1305219", nome: "DIREITO E CIDADANIA", ch: "60h", preReqs: [] },
    { nivel: "1° Nível", codigo: "1411167", nome: "PROGRAMAÇÃO I", ch: "60h", preReqs: [] },
    { nivel: "1° Nível", codigo: "1411174", nome: "INTRODUÇÃO À COMPUTAÇÃO", ch: "60h", preReqs: [] },
    { nivel: "1° Nível", codigo: "1411180", nome: "LABORATÓRIO DE PROGRAMAÇÃO I", ch: "60h", preReqs: [] },
    { nivel: "1° Nível", codigo: "1411311", nome: "COMPUTAÇÃO I", ch: "60h", preReqs: [] },
    { nivel: "2° Nível", codigo: "1109126", nome: "CÁLCULO DIFERENCIAL E INTEGRAL I", ch: "60h", preReqs: [] },
    { nivel: "2° Nível", codigo: "1303021", nome: "ECONOMIA", ch: "60h", preReqs: [] },
    { nivel: "2° Nível", codigo: "1411168", nome: "PROGRAMAÇÃO II", ch: "60h", preReqs: ["1411167","1411180"] },
    { nivel: "2° Nível", codigo: "1411181", nome: "LABORATÓRIO DE PROGRAMAÇÃO II", ch: "60h", preReqs: ["1411167","1411180"] },
    { nivel: "2° Nível", codigo: "1411312", nome: "COMPUTAÇÃO II", ch: "60h", preReqs: ["1411311"] },
    { nivel: "3° Nível", codigo: "1109049", nome: "ÁLGEBRA LINEAR I", ch: "60h", preReqs: ["1411312"] },
    { nivel: "3° Nível", codigo: "1109131", nome: "CÁLCULO DIFERENCIAL E INTEGRAL II", ch: "60h", preReqs: ["1109126"] },
    { nivel: "3° Nível", codigo: "1411172", nome: "ESTRUTURAS DE DADOS E ALGORITMOS", ch: "60h", preReqs: ["1411168","1411181"] },
    { nivel: "3° Nível", codigo: "1411179", nome: "ALGORITMOS", ch: "60h", preReqs: ["1411168","1411181"] },
    { nivel: "3° Nível", codigo: "1411307", nome: "LÓGICA PARA COMPUTAÇÃO", ch: "60h", preReqs: ["1411312"] },
    { nivel: "4° Nível", codigo: "1114129", nome: "INTRODUÇÃO À PROBABILIDADE", ch: "60h", preReqs: ["1109131"] },
    { nivel: "4° Nível", codigo: "1411171", nome: "TEORIA DA COMPUTAÇÃO", ch: "60h", preReqs: ["1411307"] },
    { nivel: "4° Nível", codigo: "1411193", nome: "BANCO DE DADOS I", ch: "60h", preReqs: ["1411172","1411179"] },
    { nivel: "4° Nível", codigo: "1411304", nome: "TEORIA DOS GRAFOS", ch: "60h", preReqs: ["1411311","1411172","1411179"] },
    { nivel: "4° Nível", codigo: "1411309", nome: "PARADIGMAS DE LINGUAGENS DE PROGRAMAÇÃO", ch: "60h", preReqs: ["1411168","1411181","1411307"] },
    { nivel: "4° Nível", codigo: "1411310", nome: "COMPUTADORES", ch: "60h", preReqs: ["1411172","1411179","1411307"] },
    { nivel: "5° Nível", codigo: "1114222", nome: "ESTATÍSTICA APLICADA", ch: "60h", preReqs: ["1114129"] },
    { nivel: "5° Nível", codigo: "1411190", nome: "REDES DE COMPUTADORES", ch: "60h", preReqs: ["1411310","1411304"] },
    { nivel: "5° Nível", codigo: "1411192", nome: "SISTEMAS OPERACIONAIS", ch: "60h", preReqs: ["1411310"] },
    { nivel: "5° Nível", codigo: "1411308", nome: "PROJETO DE SOFTWARE", ch: "60h", preReqs: ["1411193"] },
    { nivel: "5° Nível", codigo: "1411314", nome: "ENGENHARIA DE SOFTWARE", ch: "60h", preReqs: ["1411193"] },
    { nivel: "5° Nível", codigo: "1411316", nome: "INTELIGÊNCIA ARTIFICIAL", ch: "60h", preReqs: ["1411171","1109049"] },
    { nivel: "6° Nível", codigo: "1411187", nome: "ANÁLISE E TÉCNICAS DE ALGORITMOS", ch: "60h", preReqs: ["1411172","1411304"] },
    { nivel: "6° Nível", codigo: "1411313", nome: "ANÁLISE DE SISTEMAS", ch: "60h", preReqs: ["1411308","1411314"] },
    { nivel: "6° Nível", codigo: "1411315", nome: "PROGRAMAÇÃO CONCORRENTE", ch: "60h", preReqs: ["1411192"] },
    { nivel: "7° Nível", codigo: "1411189", nome: "COMPILADORES", ch: "60h", preReqs: ["1411309","1411171"] },
    { nivel: "7° Nível", codigo: "1411383", nome: "METODOLOGIA CIENTÍFICA", ch: "60h", preReqs: ["1114222"] },
    { nivel: "8° Nível", codigo: "1307169", nome: "LÍNGUA PORTUGUESA", ch: "60h", preReqs: [] },
    { nivel: "8° Nível", codigo: "1411185", nome: "PROJETO EM COMPUTAÇÃO I", ch: "60h", preReqs: ["1411314","1411313"] },
    { nivel: "9° Nível", codigo: "1411318", nome: "TRABALHO DE CONCLUSÃO DE CURSO", ch: "60h", preReqs: ["1411383","1307169"] },
    { nivel: "9° Nível", codigo: "1411348", nome: "PROJETO EM COMPUTAÇÃO II", ch: "60h", preReqs: ["1411185"] }
  ];

  // Mapa para lookup
  const subjectsMap = new Map();
  mandatorySubjects.forEach(sub => subjectsMap.set(sub.codigo, sub));

  // Mapa de dependentes reversos: para cada disciplina, lista de códigos que a têm como pré-requisito
  const reverseDeps = new Map();
  mandatorySubjects.forEach(sub => {
    sub.preReqs.forEach(pre => {
      if (!reverseDeps.has(pre)) reverseDeps.set(pre, []);
      reverseDeps.get(pre).push(sub.codigo);
    });
  });

  // Estado: conjunto de disciplinas concluídas (apenas obrigatórias)
  let completedSet = new Set();

  // ---------- Funções de validação e cascata ----------
  function arePrerequisitesMet(codigo) {
    const disciplina = subjectsMap.get(codigo);
    if (!disciplina) return true;
    const preReqs = disciplina.preReqs || [];
    return preReqs.every(preCod => completedSet.has(preCod));
  }

  // Remove recursivamente disciplinas que ficaram sem pré-requisito após desmarcação
  function cascadeUncheck(startingCode) {
    // pilha de disciplinas a verificar (a partir da que foi desmarcada)
    const toCheck = [startingCode];
    const visited = new Set();
    while (toCheck.length) {
      const current = toCheck.shift();
      if (visited.has(current)) continue;
      visited.add(current);
      // Se esta disciplina ainda está no completedSet mas seus pré-requisitos não estão mais todos satisfeitos, remova
      if (completedSet.has(current) && !arePrerequisitesMet(current)) {
        completedSet.delete(current);
        // Agora, todas as que dependem dela também podem ser afetadas
        const dependents = reverseDeps.get(current) || [];
        dependents.forEach(dep => {
          if (!visited.has(dep)) toCheck.push(dep);
        });
      } else {
        // Mesmo que não remova agora, verifique dependentes que possam ter perdido pré-requisito por outras razões
        const dependents = reverseDeps.get(current) || [];
        dependents.forEach(dep => {
          if (!visited.has(dep)) toCheck.push(dep);
        });
      }
    }
  }

  // Alterna conclusão com lógica correta (ao desmarcar, cascata remove dependentes)
  function toggleSubject(codigo) {
    const status = getSubjectStatus(codigo);
    if (status === "blocked") return;  // silencioso, sem alerta

    if (completedSet.has(codigo)) {
      // Desmarcar esta disciplina
      completedSet.delete(codigo);
      // Propagar desmarcação para dependentes que perderam pré-requisito
      cascadeUncheck(codigo);
    } else {
      // Marcar como concluída (já sabemos que está disponível, pré-requisitos ok)
      completedSet.add(codigo);
    }
    saveProgress();
    renderColumns();
    updateGlobalProgress();
  }

  function getSubjectStatus(codigo) {
    if (completedSet.has(codigo)) return "completed";
    return arePrerequisitesMet(codigo) ? "available" : "blocked";
  }

  // Persistência
  function saveProgress() {
    localStorage.setItem('completedObrigatorias', JSON.stringify([...completedSet]));
  }

  function loadProgress() {
    const saved = localStorage.getItem('completedObrigatorias');
    if (saved) {
      completedSet = new Set(JSON.parse(saved));
      // Garantir consistência após carregar: se alguma concluída tem pré-requisito não cumprido, removê-la (cascata leve)
      const toRemove = [];
      for (let code of completedSet) {
        if (!arePrerequisitesMet(code)) toRemove.push(code);
      }
      toRemove.forEach(code => completedSet.delete(code));
      saveProgress(); // corrige storage
    }
  }

  // Percentual
  function computePercent() {
    const total = mandatorySubjects.length;
    if (total === 0) return 0;
    return Math.round((completedSet.size / total) * 100);
  }

  function updateGlobalProgress() {
    const percent = computePercent();
    document.getElementById('percentDisplay').innerText = `${percent}%`;
    document.getElementById('progressFill').style.width = `${percent}%`;
  }

  // Renderização das colunas
  function renderColumns() {
    const container = document.getElementById('matrixColumns');
    if (!container) return;
    const niveisOrdenados = ["1° Nível","2° Nível","3° Nível","4° Nível","5° Nível","6° Nível","7° Nível","8° Nível","9° Nível"];
    const grouped = new Map();
    mandatorySubjects.forEach(sub => {
      const nivel = sub.nivel;
      if (!grouped.has(nivel)) grouped.set(nivel, []);
      grouped.get(nivel).push(sub);
    });

    let columnsHtml = '';
    for (let nivel of niveisOrdenados) {
      const subjectsOfLevel = grouped.get(nivel) || [];
      if (subjectsOfLevel.length === 0) continue;
      columnsHtml += `
        <div class="level-column">
          <div class="column-header">
            <h3>${nivel}</h3>
            <span>${subjectsOfLevel.length} disc.</span>
          </div>
          <div class="subjects-list">
      `;
      subjectsOfLevel.forEach(sub => {
        const status = getSubjectStatus(sub.codigo);
        let cardClass = '';
        let statusText = '';
        if (status === 'completed') {
          cardClass = 'subject-completed';
          statusText = '✅ Cursada';
        } else if (status === 'available') {
          cardClass = 'subject-available';
          statusText = '🔓 Disponível';
        } else {
          cardClass = 'subject-blocked';
          statusText = '🔒 Bloqueada';
        }
        let prereqDisplay = 'Nenhum';
        if (sub.preReqs && sub.preReqs.length) {
          const nomesPre = sub.preReqs.map(cod => subjectsMap.get(cod)?.nome || cod).join(', ');
          prereqDisplay = nomesPre;
        }
        columnsHtml += `
          <div class="subject-card ${cardClass}" onclick="toggleSubject('${sub.codigo}')">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="subject-code">${sub.codigo}</span>
              <span class="status-badge">${statusText}</span>
            </div>
            <div class="subject-name">${sub.nome}</div>
            <div><span class="subject-ch">${sub.ch}</span></div>
            <div class="pre-req-hint">📌 Pré‑req: ${prereqDisplay}</div>
          </div>
        `;
      });
      columnsHtml += `</div></div>`;
    }
    container.innerHTML = columnsHtml;
  }

  // Reset
  document.getElementById('resetBtn')?.addEventListener('click', () => {
    completedSet.clear();
    saveProgress();
    renderColumns();
    updateGlobalProgress();
  });

  loadProgress();
  renderColumns();
  updateGlobalProgress();

  // Forçar estilo cursor
  const style = document.createElement('style');
  style.textContent = `
    .subject-available, .subject-completed { cursor: pointer; }
  `;
  document.head.appendChild(style);
</script>
</body>
</html>
