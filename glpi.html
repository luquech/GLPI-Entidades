<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status das Entidades</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 15px;
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 20px;
      font-size: 26px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 500px;
      border-collapse: collapse;
    }

    th {
      background: #1e293b;
      color: white;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      white-space: nowrap;
    }

    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
      white-space: nowrap;
    }

    tr:hover {
      background: #f1f5f9;
    }

    .ok {
      color: #16a34a;
      font-weight: bold;
    }

    .entregue {
      color: #16a34a;
      font-weight: bold;
    }

    .atrasado {
      color: #dc2626;
      font-weight: bold;
    }

    .aguardando {
      color: #d97706;
      font-weight: bold;
    }

    .esquecido {
      color: #7c3aed;
      font-weight: bold;
    }

    .vazio {
      color: #94a3b8;
    }

    /* MOBILE */
    @media (max-width: 768px) {

      body {
        padding: 10px;
      }

      h1 {
        font-size: 22px;
      }

      .container {
        padding: 10px;
        border-radius: 10px;
      }

      th,
      td {
        padding: 10px 8px;
        font-size: 13px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Status das Entidades</h1>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>

          </tr>

        <tbody>

          </tr>

            <td class="entregue">ENTREGUE</td>
          </tr>

          <tr>
            <td>PROPEX</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
            <td class="atrasado">ATRASADO</td>
          </tr>

          <tr>
            <td>PROTOCOLO</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
          </tr>

          <tr>
            <td>CDSA</td>
            <td class="ok">OK</td>
            <td class="vazio">—</td>
            <td class="aguardando">AGUARDANDO</td>
          </tr>

          <tr>
            <td>SEPLAN</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
          </tr>

          <tr>
            <td>NAI</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
          </tr>

          <tr>
            <td>SC-CES</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
          </tr>

          <tr>
            <td>UAEALI</td>
            <td class="ok">OK</td>
            <td class="vazio">—</td>
            <td class="atrasado">ATRASADO</td>
          </tr>

          <tr>
            <td>ASTECH</td>
            <td class="ok">OK</td>
            <td class="ok">OK</td>
            <td class="aguardando">AGUARDANDO</td>

          <tr>

            <td class="vazio">—</td>
          </tr>

          <tr>
            <td>CES</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
            <td class="vazio">—</td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</body>
</html>
