<!doctype html>
<html lang="pt-br" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grades UFCG — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --bg-elev:#ffffff; --text:#0f1e33; --text-soft:#4b5b73;
  --border:#dbe2ee; --brand:#2c5f82; --brand-2:#3d96ad; --accent:#5a85e0;
  --shadow:0 6px 22px rgba(20,40,80,.08);
  --shadow-lg:0 14px 40px rgba(20,40,80,.14);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0e1726; --bg-elev:#16243a; --text:#e6ecf7; --text-soft:#9fb0c9;
  --border:#243551; --brand:#5a9fc7; --brand-2:#6cc0d6; --accent:#7fa4ef;
  --shadow:0 6px 22px rgba(0,0,0,.4);
  --shadow-lg:0 14px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
header{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff; padding:28px 24px;
  box-shadow:var(--shadow);
}
.header-inner{
  max-width:1200px; margin:0 auto;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.logo-wrap{
  width:64px;height:64px;border-radius:14px;background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.18); flex-shrink:0;
}
.logo-wrap img{width:54px;height:54px;object-fit:contain}
.title-block h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:.2px}
.title-block p{margin:4px 0 0;opacity:.9;font-size:.95rem}
.spacer{flex:1}
.theme-btn{
  background:rgba(255,255,255,.18); color:#fff; border:0;
  padding:10px 14px; border-radius:10px; cursor:pointer;
  font-weight:600; font-size:.9rem; transition:.2s;
}
.theme-btn:hover{background:rgba(255,255,255,.3)}

main{max-width:1200px;margin:0 auto;padding:28px 24px 60px}

.toolbar{
  display:grid; grid-template-columns: 1fr 260px; gap:14px;
  margin-bottom:22px;
}
.toolbar input, .toolbar select{
  width:100%; padding:14px 16px; border-radius:12px;
  border:1px solid var(--border); background:var(--bg-elev);
  color:var(--text); font-size:1rem; font-family:inherit;
  transition:.2s; box-shadow:var(--shadow);
}
.toolbar input:focus, .toolbar select:focus{
  outline:none; border-color:var(--brand-2);
  box-shadow:0 0 0 3px rgba(61,150,173,.25);
}

.stats{
  margin-bottom:18px; color:var(--text-soft); font-size:.9rem;
}
.stats strong{color:var(--text)}

.grid{
  display:grid; gap:16px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
.card{
  display:flex; flex-direction:column; gap:10px;
  background:var(--bg-elev); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px;
  text-decoration:none; color:inherit;
  box-shadow:var(--shadow);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
  position:relative; overflow:hidden;
}
.card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));
}
.card:hover{
  transform:translateY(-3px); box-shadow:var(--shadow-lg);
  border-color:var(--brand-2);
}
.card .nome{font-weight:700; font-size:1.02rem; line-height:1.3}
.card .meta{
  display:flex; flex-wrap:wrap; gap:6px; margin-top:auto;
}
.tag{
  font-size:.72rem; font-weight:600; padding:4px 9px; border-radius:999px;
  background:rgba(90,133,224,.12); color:var(--accent); letter-spacing:.2px;
}
.tag.codigo{
  font-family:'JetBrains Mono',monospace; font-weight:700;
  background:rgba(44,95,130,.12); color:var(--brand);
}
.tag.campus{
  background:rgba(61,150,173,.15); color:var(--brand-2);
}
.tag.turno{
  background:rgba(120,120,140,.15); color:var(--text-soft);
}

.empty{
  text-align:center; padding:60px 20px; color:var(--text-soft);
}
.empty h3{margin:0 0 6px;color:var(--text)}

footer{
  text-align:center; padding:30px 20px; color:var(--text-soft);
  font-size:.85rem;
}

@media (max-width: 720px){
  header{padding:20px 16px}
  .header-inner{gap:12px}
  .logo-wrap{width:52px;height:52px}
  .logo-wrap img{width:42px;height:42px}
  .title-block h1{font-size:1.25rem}
  .title-block p{font-size:.85rem}
  main{padding:18px 14px 50px}
  .toolbar{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{padding:14px}
}
@media (max-width: 420px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

const grid = document.getElementById('grid');
const busca = document.getElementById('busca');
const filtroCampus = document.getElementById('filtroCampus');
const stats = document.getElementById('stats');
const empty = document.getElementById('empty');

function norm(s){
  return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

function render(){
  const q = norm(busca.value.trim());
  const camp = filtroCampus.value;
  const filtrados = cursos.filter(c => {
    if (camp && c.campus !== camp) return false;
    if (!q) return true;
    return norm(c.nome).includes(q) || c.codigo.includes(q);
  });

  grid.innerHTML = filtrados.map(c => `
    <a class="card" href="${encodeURIComponent(c.arquivo)}">
      <div class="nome">${c.nome}</div>
      <div class="meta">
        <span class="tag codigo">${c.codigo}</span>
        <span class="tag campus">${c.campus}</span>
        ${c.turno ? `<span class="tag turno">${c.turno}</span>` : ""}
        ${c.curriculo ? `<span class="tag">Currículo ${c.curriculo}</span>` : ""}
      </div>
    </a>
  `).join('');

  stats.innerHTML = `Exibindo <strong>${filtrados.length}</strong> de <strong>${cursos.length}</strong> cursos`;
  empty.style.display = filtrados.length ? 'none' : 'block';
}

busca.addEventListener('input', render);
filtroCampus.addEventListener('change', render);
render();

// Tema
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.innerText = t === 'dark' ? '☀️ Tema' : '🌙 Tema';
  try{ localStorage.setItem('ufcg-theme', t); }catch(e){}
}
let saved = 'light';
try{ saved = localStorage.getItem('ufcg-theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }catch(e){}
applyTheme(saved);
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>
